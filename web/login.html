<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目库统计程序 · 登录</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4a2 2 0 0 1 2-2h6l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M9 13l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1>项目库统计程序</h1>
        <p>PROJECT LIBRARY · 多人协作版</p>
      </div>
    </div>

    <div class="login-tabs" id="tabs">
      <button class="login-tab active" data-tab="login">登录</button>
      <button class="login-tab" data-tab="register">注册</button>
    </div>

    <div class="login-form" id="formWrap">
      <div class="loading">加载中…</div>
    </div>

    <div class="login-foot" id="loginFoot">实验员请用本人账号登录 · 新用户可切换「注册」自助开通</div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="login.js"></script>
</body>
</html>
