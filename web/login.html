<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>项目库统计程序 · 登录</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script>
(function () {
  var t = "light";
  try { if (localStorage.getItem("projlib.theme") === "dark") t = "dark"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
<button class="icon-btn login-theme" id="themeBtn" title="切换明亮 / 暗黑主题" aria-label="切换主题">
  <svg class="i-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
  </svg>
  <svg class="i-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.2v2.2M12 19.6v2.2M4.2 12H2M22 12h-2.2M5.6 5.6L4.1 4.1M19.9 19.9l-1.5-1.5M18.4 5.6l1.5-1.5M4.1 19.9l1.5-1.5"/>
  </svg>
</button>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4a2 2 0 0 1 2-2h6l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M9 13l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1>项目库统计程序</h1>
        <p>PROJECT LIBRARY · 多人协作版</p>
      </div>
    </div>

    <div class="login-tabs" id="tabs">
      <button class="login-tab active" data-tab="login">登录</button>
      <button class="login-tab" data-tab="register">注册</button>
    </div>

    <div class="login-form" id="formWrap">
      <div class="loading">加载中…</div>
    </div>

    <div class="login-foot" id="loginFoot">实验员请用本人账号登录 · 新用户可切换「注册」自助开通</div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="login.js"></script>
</body>
</html>
