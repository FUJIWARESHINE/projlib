<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>项目库统计程序</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<!-- 主题要在样式表之前定下来，否则会先闪一下亮色再切到暗色 -->
<script>
(function () {
  var t = "light";
  try { if (localStorage.getItem("projlib.theme") === "dark") t = "dark"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4a2 2 0 0 1 2-2h6l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M9 13l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1>项目库统计</h1>
        <p>PROJECT LIBRARY</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="user-box" id="userBox"></div>
    <div class="sidebar-foot">项目库管理 · 月末统计 · 多人协作</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">仪表盘</h2>
        <span class="sub" id="pageSub"></span>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions" id="topActions"></div>
        <button class="icon-btn theme-btn" id="themeBtn" title="切换明亮 / 暗黑主题" aria-label="切换主题">
          <svg class="i-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="i-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.2v2.2M12 19.6v2.2M4.2 12H2M22 12h-2.2M5.6 5.6L4.1 4.1M19.9 19.9l-1.5-1.5M18.4 5.6l1.5-1.5M4.1 19.9l1.5-1.5"/>
          </svg>
        </button>
        <div class="bell-wrap" id="bellWrap">
          <button class="bell" id="notifBell" title="消息中心" aria-label="消息中心">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
            <span class="bell-badge" id="notifBadge" hidden>0</span>
          </button>
        </div>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="notifRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="core.js"></script>
<script src="views.js"></script>
<script>boot();</script>
</body>
</html>
